<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a5ae0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7bff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="umbrellaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdd9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39a9f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>

  <!-- Beach umbrella -->
  <g transform="translate(50, 35)">
    <!-- Umbrella top -->
    <ellipse cx="0" cy="0" rx="28" ry="12" fill="url(#umbrellaGrad)"/>
    <path d="M -28,0 Q -28,8 0,15 Q 28,8 28,0" fill="#ff8a8a" opacity="0.3"/>

    <!-- Umbrella stripes -->
    <line x1="-20" y1="0" x2="-10" y2="10" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="-10" y1="0" x2="0" y2="12" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="15" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="0" x2="0" y2="12" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="0" x2="10" y2="10" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>

    <!-- Pole -->
    <line x1="0" y1="12" x2="0" y2="45" stroke="#8b7355" stroke-width="3" stroke-linecap="round"/>

    <!-- Pole tip -->
    <circle cx="0" cy="45" r="2" fill="#6b5344"/>
  </g>

  <!-- Sand/ground indicator -->
  <ellipse cx="50" cy="82" rx="15" ry="3" fill="#fff" opacity="0.3"/>
</svg>

