<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отпуска 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="64x64" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><b>Отпуска</b><span>2026</span></div>
    <nav class="nav" id="nav">
      <button type="button" data-nav="timeline">Таймлайн</button>
      <button type="button" data-nav="rules">Правила</button>
      <button type="button" data-nav="calendar">Календарь</button>
    </nav>
    <div class="counters" id="counters"></div>
    <div class="spacer"></div>
    <input type="search" id="emp-search" class="search" placeholder="Найти сотрудника…" autocomplete="off">
    <div class="menu-wrap">
      <button type="button" class="btn" id="data-menu-btn">Данные · CSV</button>
      <div class="menu hidden" id="data-menu">
        <div class="menu-head">Импорт</div>
        <button type="button" data-csv="import-employees">Импорт сотрудников</button>
        <button type="button" data-csv="import-vacations">Импорт отпусков</button>
        <button type="button" data-csv="import-holidays">Импорт праздников</button>
        <div class="menu-sep"></div>
        <div class="menu-head">Экспорт</div>
        <button type="button" data-csv="export-employees">Экспорт сотрудников</button>
        <button type="button" data-csv="export-vacations">Экспорт отпусков</button>
        <button type="button" data-csv="export-holidays">Экспорт праздников</button>
        <div class="menu-sep"></div>
        <div class="menu-head">Скачать шаблоны</div>
        <a href="templates/employees_template.csv" download>Шаблон сотрудников</a>
        <a href="templates/vacations_template.csv" download>Шаблон отпусков</a>
        <a href="templates/holidays.csv" download>Праздничные дни</a>
        <div class="menu-sep"></div>
        <button type="button" data-csv="clear" class="danger">Очистить все данные</button>
      </div>
    </div>
    <button type="button" class="btn btn-primary" id="new-vac-btn">Новый отпуск<span class="kbd">N</span></button>
  </header>

  <main id="view"></main>

  <input type="file" id="file-employees" accept=".csv" hidden>
  <input type="file" id="file-vacations" accept=".csv" hidden>
  <input type="file" id="file-holidays" accept=".csv" hidden>
  <div id="toast" class="toast hidden"></div>

  <!-- Важно: file:// блокирует ES-модули (origin=null). Поэтому подключаем как обычные скрипты. -->
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/employee.js"></script>
  <script>VS.start();</script>
</body>
</html>
